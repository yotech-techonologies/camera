<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - SecureCam CCTV Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#111;
    color:#fff;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:700px;
    margin:40px auto;
}

.checkout-box{
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.checkout-box h2{
    margin-bottom:20px;
    text-align:center;
}

.total{
    background:#007bff;
    color:#fff;
    padding:15px;
    text-align:center;
    border-radius:6px;
    font-size:24px;
    margin-bottom:25px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:vertical;
    height:100px;
}

button{
    width:100%;
    padding:15px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.links a{
    text-decoration:none;
    color:#007bff;
    font-weight:bold;
}

footer{
    background:#111;
    color:#fff;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>

</head>
<body>

<header>

<h1>SecureCam CCTV Store</h1>

<p>Secure Checkout</p>

</header>

<div class="container">

<div class="checkout-box">

<h2>Complete Your Order</h2>

<div class="total">
Total: ₦<span id="total">0</span>
</div>

<form onsubmit="placeOrder(event)">

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<input type="email" placeholder="Email Address" required>

<textarea placeholder="Delivery Address" required></textarea>

<button type="submit">
Place Order
</button>

</form>

<div class="links">
<a href="cart.html">← Back to Cart</a>
<a href="index.html">Continue Shopping</a>
</div>

</div>

</div>

<footer>

<p>© 2026 SecureCam CCTV Store. All Rights Reserved.</p>

</footer>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

cart.forEach(item=>{
    total += item.price;
});

document.getElementById("total").innerHTML = total.toLocaleString();

function placeOrder(event){

event.preventDefault();

if(cart.length===0){

alert("Your cart is empty.");

return;

}

alert(
"Thank you for your order!\n\n" +
"Your order has been received successfully.\n" +
"Total Amount: ₦" + total.toLocaleString()
);

localStorage.removeItem("cart");

window.location.href="index.html";

}

</script>

</body>
</html>
