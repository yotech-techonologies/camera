<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - SecureCam CCTV Store</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}
h1{
    text-align:center;
    margin-bottom:20px;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    margin-bottom:20px;
}
th, td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}
th{
    background:#007bff;
    color:white;
}
.total{
    text-align:right;
    font-size:20px;
    font-weight:bold;
    margin:20px 0;
}
form{
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
    max-width:600px;
    margin:0 auto;
}
form label{
    display:block;
    margin:10px 0 5px;
    font-weight:bold;
}
form input, form textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    padding:12px 20px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#1e7e34;
}
</style>
</head>
<body>

<h1>Checkout</h1>

<table id="checkoutTable">
<thead>
<tr>
<th>Product</th>
<th>Price</th>
</tr>
</thead>
<tbody>
<!-- Items will be injected here -->
</tbody>
</table>

<div class="total" id="totalAmount">Total: ₦0</div>

<form onsubmit="placeOrder(event)">
    <h2>Customer Information</h2>
    <label for="name">Full Name</label>
    <input type="text" id="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" required>

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" required>

    <label for="address">Delivery Address</label>
    <textarea id="address" rows="4" required></textarea>

    <button type="submit">Place Order</button>
</form>

<script>
function loadCheckout(){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let tbody = document.querySelector("#checkoutTable tbody");
    let total = 0;
    tbody.innerHTML = "";

    cart.forEach(item => {
        let row = document.createElement("tr");
        row.innerHTML = `
            <td>${item.name}</td>
            <td>₦${item.price.toLocaleString()}</td>
        `;
        tbody.appendChild(row);
        total += item.price;
    });

    document.getElementById("totalAmount").textContent = "Total: ₦" + total.toLocaleString();
}

function placeOrder(event){
    event.preventDefault();
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;

    alert("Thank you, " + name + "! Your order has been placed.\n\nWe will deliver to:\n" + address);

    // Clear cart after checkout
    localStorage.removeItem("cart");
    window.location.href = "index.html";
}

window.onload = loadCheckout;
</script>

</body>
</html>
