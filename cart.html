<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - SecureCam CCTV Store</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}
h1{
    text-align:center;
    margin-bottom:20px;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}
th, td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}
th{
    background:#007bff;
    color:white;
}
button{
    padding:8px 12px;
    background:#dc3545;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#a71d2a;
}
.checkout{
    margin-top:20px;
    text-align:right;
}
.checkout button{
    background:#28a745;
}
.checkout button:hover{
    background:#1e7e34;
}
</style>
</head>
<body>

<h1>Your Shopping Cart</h1>

<table id="cartTable">
<thead>
<tr>
<th>Product</th>
<th>Price</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<!-- Items will be injected here -->
</tbody>
</table>

<div class="checkout">
<button onclick="checkout()">Proceed to Checkout</button>
</div>

<script>
function loadCart(){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let tbody = document.querySelector("#cartTable tbody");
    tbody.innerHTML = "";

    cart.forEach((item, index) => {
        let row = document.createElement("tr");

        row.innerHTML = `
            <td>${item.name}</td>
            <td>₦${item.price.toLocaleString()}</td>
            <td><button onclick="removeItem(${index})">Remove</button></td>
        `;
        tbody.appendChild(row);
    });
}

function removeItem(index){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index,1);
    localStorage.setItem("cart",JSON.stringify(cart));
    loadCart();
}

function checkout(){
    alert("Proceeding to checkout...");
    // You can redirect to checkout.html or handle payment here
    window.location.href = "checkout.html";
}

window.onload = loadCart;
</script>

</body>
</html>
